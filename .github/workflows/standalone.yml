name: Standalone validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore Gens.slnx
      - run: dotnet format Gens.slnx --no-restore --verify-no-changes
      - run: dotnet build Gens.slnx --no-restore --configuration Release
      - run: dotnet test Gens.slnx --no-restore --no-build --configuration Release
      - run: ./scripts/check-no-package-build-output.sh
      - name: Run skeleton benchmark
        run: dotnet run --project benchmarks/Gens.Simulation.Benchmarks --no-restore --configuration Release -- --job Dry
      - run: ./scripts/verify-deterministic-build.sh
      - run: ./scripts/check-clean-worktree.sh

  content:
    # Independent so content errors are reported even when tests fail.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore tools/Gens.ContentCompiler/Gens.ContentCompiler.csproj
      - name: Validate every content family (schema, duplicate IDs, references, localization)
        run: dotnet run --project tools/Gens.ContentCompiler --no-restore --configuration Release -- validate content
      - name: Compile the golden content pack
        run: dotnet run --project tools/Gens.ContentCompiler --no-restore --configuration Release -- compile content artifacts/content/catalog.json
      - name: Exit-gate smoke test — bootstrap, save, verify, migrate, reload, compare hashes
        run: |
          set -euo pipefail
          dotnet run --project tools/Gens.ContentCompiler --no-restore --configuration Release -- \
            run-campaign --seed 1 --months 12 --out artifacts/saves/smoke.gens --content-hash smoke
          dotnet run --project tools/Gens.ContentCompiler --no-restore --configuration Release -- \
            verify-save artifacts/saves/smoke.gens
          dotnet run --project tools/Gens.ContentCompiler --no-restore --configuration Release -- \
            migrate-save artifacts/saves/smoke.gens --out artifacts/saves/smoke-migrated.gens
          dotnet run --project tools/Gens.ContentCompiler --no-restore --configuration Release -- \
            replay artifacts/saves/smoke.gens
      - name: UR-01 shared scenario — reproduce and diff the checked-in native hash transcript
        run: |
          set -euo pipefail
          dotnet run --project tools/Gens.ContentCompiler --no-restore --configuration Release -- \
            run-shared-scenario tests/Gens.Simulation.Tests/Saves/Fixtures/shared-scenario.json \
            --content artifacts/content/catalog.json \
            --fixtures-out artifacts/ur01-ci/ur01 \
            --transcript-out artifacts/ur01-ci/hash-transcript.json
          diff tests/Gens.Simulation.Tests/Saves/Fixtures/ur01-hash-transcript-native.json artifacts/ur01-ci/hash-transcript.json
      - run: ./scripts/check-clean-worktree.sh

  native-packages:
    name: Native package (${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
          - os: macos-latest
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore Gens.slnx
      - run: dotnet build Gens.slnx --no-restore --configuration Release
      - run: dotnet test Gens.slnx --no-restore --no-build --configuration Release
      - shell: pwsh
        run: ./scripts/publish-native-client.ps1 -Runtime ${{ matrix.runtime }}
      - name: Windows packaged smoke test
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: ./artifacts/native/win-x64/Gens.Client.Desktop.exe --renderer=software --smoke-test --screen=settings --developer --locale=qps-ploc --reduced-motion --high-contrast --user-data=artifacts/smoke-user
      - uses: actions/upload-artifact@v7
        with:
          name: gens-${{ matrix.runtime }}
          path: artifacts/native/${{ matrix.runtime }}*
